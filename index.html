<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>베보댄 — Vocal & Dance Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>/* ==========================================================
   베보댄 — Vocal & Dance Academy
   Mobile-first, dark, purple accent
   ========================================================== */

:root {
  --bg: #0A0A0B;
  --bg-elev: #131316;
  --bg-card: #18181C;
  --line: #232329;
  --line-soft: #1C1C21;
  --fg: #F4F4F6;
  --fg-mute: #A6A6AE;
  --fg-dim: #6B6B73;
  --accent: #7F77DD;
  --accent-soft: #5F58A8;
  --accent-glow: rgba(127, 119, 221, 0.35);
  --kakao: #FEE500;
  --kakao-fg: #181600;
  --call: #1FBA66;
  --radius: 14px;
  --radius-lg: 20px;
  --max: 1200px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--fg); }

body {
  font-family: 'Pretendard', 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  font-feature-settings: 'tnum', 'ss01';
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

img, video { max-width: 100%; display: block; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }

.num, .display {
  font-family: 'Inter', 'Pretendard', sans-serif;
  font-feature-settings: 'tnum';
  letter-spacing: -0.02em;
}

/* ===== Layout ===== */
.wrap {
  width: 100%;
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 20px;
}

section {
  padding: 72px 0;
  position: relative;
}

@media (min-width: 720px) {
  section { padding: 112px 0; }
  .wrap { padding: 0 32px; }
}

/* ===== Top Nav ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  background: rgba(10, 10, 11, 0.7);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease, background .2s ease;
}
.nav.scrolled { border-bottom-color: var(--line-soft); }
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  padding: 0 20px;
  max-width: var(--max);
  margin: 0 auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: -0.01em;
  font-size: 15px;
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
}
.brand svg, .brand-mark { flex-shrink: 0; }
.brand-mark {
  width: 32px;
  height: 32px;
  object-fit: contain;
}
.footer-logo-img {
  display: block;
  width: 80px;
  height: 80px;
  object-fit: contain;
}
.nav-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-weight: 600;
  font-size: 13px;
  transition: transform .15s ease;
}
.nav-cta:hover { transform: translateY(-1px); }

/* ===== Hero ===== */
.hero {
  position: relative;
  /* 영상이 전체 viewport를 채우면서 viewport 크기에 따라 같이 축소됨 */
  height: 100svh;
  min-height: 480px;
  padding-top: 56px;
  display: flex;
  align-items: stretch;
  overflow: hidden;
}
.hero-video {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hero-video::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(140% 90% at 50% 50%, transparent 0%, rgba(0,0,0,0.18) 80%, rgba(0,0,0,0.35) 100%);
  z-index: 2;
  pointer-events: none;
}
.hero-photo {
  position: absolute;
  inset: 0;
  background-image: url("img/stage-main.jpg");
  background-size: cover;
  background-position: center 30%;
  z-index: 1;
  filter: saturate(0.95) contrast(1.02);
}
.hero-video-wrap {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

/*
   영상이 컨테이너에 항상 contain(전체 영상 보임 + 16:9 비율 유지)되도록 처리.
   컨테이너(부모) 비율에 따라:
   - 부모가 16:9보다 넓을 때 → 높이 기준 (height: 100%)
   - 부모가 16:9보다 좁을 때 → 너비 기준 (width: 100%)
   이렇게 하면 viewport가 줄어들면 영상도 같이 줄어듭니다.
*/
.hero-video-wrap iframe {
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  max-width: 100%;
  max-height: 100%;
  border: 0;
  pointer-events: none;
  display: block;
}
.hero-photo::after, .hero-video-wrap::after {
  content: none;
}
.hero-content {
  position: relative;
  z-index: 3;
  width: 100%;
  display: flex;
  flex-direction: column;
  /* 화면 중앙쯤에 박스가 오도록 — 영상이 위로 보이고 텍스트 박스는 가운데~약간 위 */
  justify-content: center;
  padding: 88px 20px 40px;
}
.hero-text {
  position: relative;
  display: inline-block;
  max-width: 880px;
  padding: 24px 24px 24px;
  border-radius: 14px;
  /* 글씨 뒤만 어두운 그라디언트 박스 — 영상은 그대로 보임 */
  background: linear-gradient(135deg, rgba(10,10,11,0.78) 0%, rgba(10,10,11,0.62) 60%, rgba(10,10,11,0.42) 100%);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
}
@media (min-width: 720px) {
  .hero-text { padding: 32px 36px 32px; }
}
.hero-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  align-items: end;
  width: 100%;
}
@media (min-width: 960px) {
  .hero-grid {
    grid-template-columns: minmax(0, 1.2fr) minmax(280px, 360px);
    gap: 40px;
    align-items: end;
  }
}

/* ===== Debut Slider (Horizontal Section) ===== */
.debut-section {
  position: relative;
  padding: 64px 0 72px;
  background:
    radial-gradient(80% 100% at 50% 0%, rgba(127,119,221,0.18), transparent 70%),
    linear-gradient(180deg, rgba(20,18,38,0.4), transparent);
  border-top: 1px solid rgba(127,119,221,0.18);
  border-bottom: 1px solid rgba(127,119,221,0.12);
  overflow: hidden;
}
.debut-section::before {
  content: "DEBUT";
  position: absolute;
  top: 12px; right: -20px;
  font-size: 180px;
  font-weight: 900;
  letter-spacing: -0.06em;
  color: rgba(127,119,221,0.06);
  pointer-events: none;
  line-height: 1;
}
.debut-section .debut-head {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 28px;
}
@media (min-width: 720px) {
  .debut-section .debut-head {
    flex-direction: row;
    align-items: flex-end;
    justify-content: space-between;
  }
}
.debut-section .debut-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.debut-pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  animation: founderPulse 1.8s ease-in-out infinite;
}
.debut-title {
  font-size: clamp(28px, 5.5vw, 44px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin-bottom: 10px;
}
.debut-desc-big {
  font-size: clamp(18px, 3.2vw, 28px);
  line-height: 1.5;
  color: var(--fg);
  text-align: center;
  margin: 0 auto;
  max-width: 760px;
  font-weight: 500;
}
.debut-desc-big strong {
  font-weight: 800;
  font-size: 1.2em;
  color: #fff;
}
.debut-desc-big .accent {
  font-weight: 800;
}
.hero-h-mega {
  display: inline-block;
  font-size: clamp(44px, 11vw, 110px);
  font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 0.95;
}
.debut-desc {
  font-size: 14px;
  color: var(--fg-mute);
  line-height: 1.55;
  max-width: 520px;
}
.debut-controls {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.debut-arrow {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(127,119,221,0.4);
  background: rgba(20,18,38,0.6);
  color: var(--fg);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .2s ease, transform .15s ease, border-color .2s ease;
}
.debut-arrow svg { width: 18px; height: 18px; }
.debut-arrow:hover {
  background: var(--accent);
  border-color: var(--accent);
  transform: translateY(-2px);
}
.debut-arrow:active { transform: translateY(0); }

.debut-track-wrap {
  position: relative;
}
.debut-track-wrap::after {
  content: "";
  position: absolute;
  right: 0; top: 0; bottom: 12px;
  width: 80px;
  background: linear-gradient(90deg, transparent, var(--bg) 90%);
  pointer-events: none;
  z-index: 2;
}
.debut-track {
  display: flex;
  gap: 14px;
  padding: 8px 16px 14px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.debut-track::-webkit-scrollbar { display: none; }
@media (min-width: 720px) {
  .debut-track { padding: 8px 32px 18px; gap: 18px; }
}
.debut-card {
  flex: 0 0 auto;
  width: 220px;
  scroll-snap-align: start;
  border-radius: 16px;
  overflow: hidden;
  background: #1a1822;
  border: 1px solid rgba(255,255,255,0.06);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .2s ease, box-shadow .25s ease;
}
.debut-card:hover {
  transform: translateY(-4px);
  border-color: rgba(127,119,221,0.5);
  box-shadow: 0 18px 40px rgba(127,119,221,0.18);
}
@media (min-width: 720px) {
  .debut-card { width: 260px; }
}
@media (min-width: 1024px) {
  .debut-card { width: 280px; }
}
.debut-photo {
  position: relative;
  aspect-ratio: 3 / 4;
  background-size: cover;
  background-position: center 22%;
  background-color: #d4d4d4;
}
.debut-photo::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,0.92) 100%);
}
.debut-year-badge {
  position: absolute;
  top: 12px; left: 12px;
  z-index: 2;
  padding: 5px 10px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
  color: #fff;
  background: var(--accent);
  border-radius: 999px;
  box-shadow: 0 6px 14px rgba(127,119,221,0.4);
}
.debut-overlay {
  position: absolute;
  left: 14px; right: 14px; bottom: 14px;
  z-index: 2;
}
.debut-overlay .debut-group {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.debut-overlay .debut-name {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.01em;
  line-height: 1.1;
  margin-bottom: 4px;
}
.debut-overlay .debut-role {
  font-size: 11px;
  color: rgba(255,255,255,0.78);
}

.debut-card-cta {
  background: linear-gradient(135deg, rgba(127,119,221,0.22), rgba(127,119,221,0.08));
  border: 1px dashed rgba(127,119,221,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.debut-cta-inner {
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.debut-cta-eyebrow {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.2em;
  color: var(--accent);
}
.debut-cta-text {
  font-size: 22px;
  font-weight: 800;
  color: var(--fg);
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.debut-cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
  margin-top: 4px;
  transition: transform .15s ease, background .2s ease;
}
.debut-cta-btn:hover { transform: translateY(-2px); background: #6e64d6; }


.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 20px;
}
.hero-eyebrow::before {
  content: "";
  width: 24px; height: 1px; background: var(--accent);
}
.hero h1 {
  font-size: clamp(30px, 6.5vw, 60px);
  line-height: 1.05;
  letter-spacing: -0.04em;
  font-weight: 800;
  margin-bottom: 20px;
}
.hero h1 .accent { color: var(--accent); }
.hero h1 em {
  font-style: normal;
  display: block;
  color: var(--fg-mute);
  font-weight: 500;
  font-size: 0.45em;
  margin-top: 16px;
  letter-spacing: -0.02em;
}
.hero-sub {
  color: var(--fg-mute);
  font-size: 15px;
  max-width: 480px;
  margin-bottom: 32px;
}
.hero-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 20px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14px;
  transition: transform .15s ease, background .15s ease;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 8px 30px var(--accent-glow);
}
.btn-primary:hover { transform: translateY(-2px); }
.btn-ghost {
  background: rgba(255,255,255,0.06);
  color: var(--fg);
  border: 1px solid var(--line);
}
.btn-ghost:hover { background: rgba(255,255,255,0.1); }
.hero-scroll {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  font-size: 11px;
  color: var(--fg-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.hero-scroll-line {
  width: 1px; height: 32px;
  background: linear-gradient(to bottom, transparent, var(--accent));
  animation: scroll-pulse 2s ease-in-out infinite;
}
@keyframes scroll-pulse {
  0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
  50% { opacity: 1; transform: scaleY(1); }
}

/* ===== 모바일: 영상 위 / 글씨 아래 2단 레이아웃 (720px 미만) ===== */
@media (max-width: 719px) {
  .hero {
    height: auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: visible;
  }
  /* 영상을 화면 흐름 안에 배치 — 가로폭에 맞춰 16:9로 꽉 차게 (반응형) */
  .hero-video {
    position: relative;
    inset: auto;
    width: 100%;
    aspect-ratio: 16 / 9;
  }
  .hero-photo,
  .hero-video-wrap {
    position: absolute;
    inset: 0;
  }
  .hero-video-wrap iframe {
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
  }
  /* 글씨 영역을 영상 바로 아래로 */
  .hero-content {
    position: relative;
    justify-content: flex-start;
    padding: 28px 20px 44px;
  }
  /* 영상 위에 겹칠 때 쓰던 어두운 박스 효과 제거 — 이제 영상 아래라 불필요 */
  .hero-text {
    max-width: 100%;
    padding: 0;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: none;
    box-shadow: none;
  }
  /* SCROLL 표시는 흐름 배치와 어울리지 않아 모바일에선 숨김 */
  .hero-scroll { display: none; }
}

@media (min-width: 720px) {
  .hero-content { padding: 120px 32px 80px; }
}

/* ===== Section heading ===== */
.sec-head {
  margin-bottom: 40px;
}
.sec-eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.sec-eyebrow::before {
  content: ""; width: 20px; height: 1px; background: var(--accent);
}
.sec-title {
  font-size: clamp(28px, 5vw, 44px);
  line-height: 1.15;
  letter-spacing: -0.03em;
  font-weight: 700;
  text-wrap: pretty;
}
.sec-title .accent { color: var(--accent); }
.sec-desc {
  margin-top: 14px;
  color: var(--fg-mute);
  font-size: 15px;
  max-width: 560px;
}
@media (min-width: 720px) {
  .sec-head { margin-bottom: 56px; }
}

/* ===== Stats (신뢰 숫자) ===== */
.stats-section {
  background: var(--bg);
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0;
  border-top: 1px solid var(--line-soft);
}
.stat {
  padding: 32px 20px;
  border-right: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  position: relative;
}
.stat:nth-child(2n) { border-right: none; }
.stat-num {
  font-family: 'Inter', sans-serif;
  font-size: clamp(48px, 12vw, 96px);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--fg);
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.stat-suffix {
  font-size: 0.4em;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: -0.02em;
}
.stat-label {
  margin-top: 14px;
  font-size: 13px;
  color: var(--fg-mute);
  letter-spacing: -0.01em;
}
.stat-sub {
  margin-top: 4px;
  font-size: 11px;
  color: var(--fg-dim);
  font-family: 'Inter', monospace;
  letter-spacing: 0.04em;
}

@media (min-width: 720px) {
  .stats-grid { grid-template-columns: repeat(5, 1fr); }
  .stat { padding: 48px 24px; border-right: 1px solid var(--line-soft); border-bottom: none; }
  .stat:nth-child(2n) { border-right: 1px solid var(--line-soft); }
  .stat:last-child { border-right: none; }
}
@media (max-width: 719px) {
  .stat:nth-last-child(1):nth-child(odd) { grid-column: span 2; }
}

/* ===== Video Grid (수업 영상) ===== */
.vgrid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.vcard {
  position: relative;
  border-radius: var(--radius);
  aspect-ratio: 3/4;
  overflow: hidden;
  aspect-ratio: 9/16;
  background: var(--bg-card);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: transform .25s ease, border-color .25s ease;
}
.vcard:hover {
  transform: translateY(-3px);
  border-color: var(--accent-soft);
}
.vcard-bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  transition: transform .6s ease;
}
.vcard:hover .vcard-bg { transform: scale(1.05); }
.vcard-bg::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.85) 100%);
}
.vcard-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.9) 100%);

  flex-direction: column;
  justify-content: flex-end;
  padding: 16px;
}
.vcard-play {
  position: absolute;
  width: 44px; height: 44px;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.2);
  transition: background .15s ease, transform .15s ease;
}
.vcard:hover .vcard-play {
  background: var(--accent);
  border-color: var(--accent);
  transform: translate(-50%, -50%) scale(1.1);
}
.vcard-play svg { margin-left: 2px; }
.vcard-tag {
  display: inline-block;
  padding: 3px 7px;
  font-size: 10px;
  background: rgba(127,119,221,0.2);
  color: var(--accent);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  margin-bottom: 8px;
  width: fit-content;
}
.vcard-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
}
.vcard-meta {
  font-size: 11px;
  color: var(--fg-mute);
  font-family: 'Inter', monospace;
  margin-top: 4px;
  letter-spacing: 0.04em;
}

@media (min-width: 540px) {
  .vgrid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
}
@media (min-width: 900px) {
  .vgrid { grid-template-columns: repeat(5, 1fr); gap: 12px; }

.ccard-num {

/* ===== Teachers ===== */
.tgrid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.tcard {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  aspect-ratio: 3/4;
  background: var(--bg-card);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: transform .25s ease;
}
.tcard:hover { transform: translateY(-4px); }
.tcard-photo {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center top;
  filter: grayscale(0.15) contrast(1.05);
  transition: transform .6s ease, filter .3s ease;
}
.tcard:hover .tcard-photo {
  transform: scale(1.04);
  filter: grayscale(0) contrast(1.05);
}
.tcard-photo::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.85) 100%);
}
.tcard-info {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 16px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.9) 60%);
}
.tcard-role {
  font-size: 11px;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.tcard-name {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.tcard-bio {
  font-size: 11px;
  color: var(--fg-mute);
  line-height: 1.4;
}
.tcard-insta {
  position: absolute;
  top: 12px; right: 12px;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.1);
  transition: background .15s ease;
}
.tcard-insta:hover { background: var(--accent); }

/* ===== Teachers — Photo Grid ===== */
.tgrid-cutout {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.tcut {
  position: relative;
  display: block;
  text-decoration: none;
  color: inherit;
  border-radius: 10px;
  overflow: hidden;
  background: #d4d4d4;
  border: 1px solid rgba(255,255,255,0.06);
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease;
}
.tcut:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 32px rgba(0,0,0,0.5);
}
.tcut-photo {
  position: relative;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  background: #d4d4d4;
}
.tcut-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 20%;
  display: block;
  transition: transform .35s cubic-bezier(.2,.8,.2,1);
}
.tcut:hover .tcut-photo img { transform: scale(1.04); }

.tcut-info {
  padding: 12px 14px 14px;
  background: rgba(10,10,11,0.92);
  backdrop-filter: blur(6px);
  border-top: 1px solid rgba(255,255,255,0.06);
}
.tcut-role {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.tcut-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}
.tcut-ig {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--fg-mute);
  font-family: 'Inter', monospace;
}
.tcut-ig svg { width: 11px; height: 11px; }

@media (min-width: 560px) {
  .tgrid-cutout { grid-template-columns: repeat(3, 1fr); gap: 12px; }
}
@media (min-width: 900px) {
  .tgrid-cutout { grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .tcut-info { padding: 14px 16px 16px; }
  .tcut-role { font-size: 11px; }
  .tcut-name { font-size: 16px; }
  .tcut-ig { font-size: 11px; }
}

.insta-more {
  margin-top: 24px;

}
.insta-link {

  align-items: center;

  font-size: 14px;
  font-weight: 600;

}
.insta-link:hover {

}
.insta-link svg { color: var(--accent); }

@media (min-width: 720px) {
  .tgrid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
}

/* ===== Location & Contact ===== */
.contact-section {
  background: #0C0C10;
  border-top: 1px solid var(--line-soft);
}
.contact-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
.map-card {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--line);
  aspect-ratio: 16/11;
  background: #0F0F14;
  display: flex;
  flex-direction: column;
}
.map-frame {
  flex: 1;
  width: 100%;
  border: 0;
  display: block;
}
.map-pin {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -100%);
}
.map-pin-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
  box-shadow: 0 0 0 8px rgba(127,119,221,0.2), 0 0 30px var(--accent-glow);
  animation: pin-pulse 2s ease-in-out infinite;
}
@keyframes pin-pulse {
  0%, 100% { box-shadow: 0 0 0 8px rgba(127,119,221,0.2), 0 0 30px var(--accent-glow); }
  50% { box-shadow: 0 0 0 16px rgba(127,119,221,0.05), 0 0 40px var(--accent-glow); }
}
.map-label {
  background: var(--bg-elev);

  gap: 12px;
}
.map-label-text { flex: 1; min-width: 0; }
.map-label-name { font-size: 14px; font-weight: 700; }
.map-label-addr { font-size: 12px; color: var(--fg-mute); margin-top: 2px; }
.map-nav-btn {
  flex-shrink: 0;
  padding: 8px 14px;
  background: var(--accent);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
}

.contact-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.contact-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  transition: all .2s ease;
}
.contact-row:hover {
  border-color: var(--accent-soft);
  background: linear-gradient(90deg, rgba(127,119,221,0.06), var(--bg-card));
}
.contact-icon {
  flex-shrink: 0;
  width: 44px; height: 44px;
  border-radius: 12px;
  background: rgba(127,119,221,0.1);
  border: 1px solid rgba(127,119,221,0.2);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
}
.contact-row.kakao .contact-icon { background: rgba(254,229,0,0.1); border-color: rgba(254,229,0,0.25); color: var(--kakao); }
.contact-row.call .contact-icon { background: rgba(31,186,102,0.1); border-color: rgba(31,186,102,0.25); color: var(--call); }
.contact-text { flex: 1; min-width: 0; }
.contact-label {
  font-size: 11px;
  color: var(--fg-mute);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.contact-value {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  font-family: 'Inter', 'Pretendard', sans-serif;
}
.contact-arrow {
  color: var(--fg-dim);
  transition: color .15s ease, transform .15s ease;
}
.contact-row:hover .contact-arrow {
  color: var(--accent);
  transform: translateX(2px);
}

@media (min-width: 900px) {
  .contact-layout { grid-template-columns: 1.4fr 1fr; gap: 24px; }

/* ===== Founder Badge ===== */
.founder-badge {
  position: relative;
  padding: 28px 0;
  background: linear-gradient(90deg, rgba(127,119,221,0.04) 0%, rgba(127,119,221,0.0) 100%);
  border-bottom: 1px solid rgba(127,119,221,0.18);
}
.founder-wrap { padding-left: 16px; padding-right: 16px; }
.founder-stripe {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 18px;
  padding: 20px 22px;
  border-radius: 18px;
  background:
    radial-gradient(120% 80% at 20% 0%, rgba(127,119,221,0.18), transparent 60%),
    linear-gradient(135deg, rgba(20,18,38,0.95), rgba(10,10,11,0.96));
  border: 1px solid rgba(127,119,221,0.35);
  overflow: hidden;
}
.founder-stripe::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--accent), #5d54bd);
}
.founder-mark {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 72px;
  height: 72px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), #5d54bd);
  color: #fff;
  box-shadow: 0 10px 24px rgba(127,119,221,0.35);
  flex-shrink: 0;
}
.founder-mark-num {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
}
.founder-mark-unit {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.16em;
  margin-top: 2px;
  opacity: 0.92;
}
.founder-text { min-width: 0; }
.founder-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.founder-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  animation: founderPulse 2s ease-in-out infinite;
}
@keyframes founderPulse {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.15); }
}
.founder-headline {
  font-size: 16px;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.45;
  letter-spacing: -0.01em;
}
.founder-em {
  background: linear-gradient(90deg, #fff, #c9c4f5);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-weight: 800;
}
.founder-underline {
  background: linear-gradient(180deg, transparent 60%, rgba(127,119,221,0.45) 60%);
  padding: 0 2px;
}
.founder-decor {
  display: none;
  flex-shrink: 0;
  opacity: 0.7;
}
@media (min-width: 720px) {
  .founder-badge { padding: 36px 0; }
  .founder-stripe { padding: 26px 32px; gap: 24px; }
  .founder-mark { width: 88px; height: 88px; }
  .founder-mark-num { font-size: 34px; }
  .founder-headline { font-size: 22px; }
  .founder-decor { display: block; }
}
@media (min-width: 1024px) {

.parallax-section {
  position: relative;
  isolation: isolate;
}
.parallax-section::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  opacity: 0.3;
  filter: saturate(0.9) contrast(1.05);
}
.parallax-section::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(180deg, rgba(10,10,11,0.82) 0%, rgba(10,10,11,0.65) 50%, rgba(10,10,11,0.85) 100%);
  pointer-events: none;
}
.parallax-section[data-parallax="stage-art"]::before    { background-image: url("img/stage-art.jpg"); }
.parallax-section[data-parallax="stage-main"]::before   { background-image: url("img/stage-main.jpg"); }
.parallax-section[data-parallax="class-vocal"]::before  { background-image: url("img/class-vocal.jpg"); }
.parallax-section[data-parallax="class-dance"]::before  { background-image: url("img/class-dance.jpg"); }
.parallax-section[data-parallax="class-stretch"]::before{ background-image: url("img/class-stretch.jpg"); }
.parallax-section[data-parallax="studio"]::before       { background-image: url("img/studio.jpg"); }

/* iOS doesn't support background-attachment: fixed reliably — fall back to scroll */
@media (hover: none) and (pointer: coarse) {
  .parallax-section::before {
    background-attachment: scroll;
    opacity: 0.25;
  }
}

/* Make sections transparent so the parallax shows through */
.stats-section,
.courses-section,
.facilities-section,
.contact-section {
  background: transparent !important;
}


.fab-stack {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.fab-circle {
  position: relative;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  display: block;
  text-decoration: none;
  filter: drop-shadow(0 14px 30px rgba(0,0,0,0.45));
  transition: transform .25s cubic-bezier(.2,.8,.2,1);
}
.fab-circle:hover { transform: translateY(-4px) scale(1.04); }
.fab-circle .fab-ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  animation: fabSpin 14s linear infinite;
}
.fab-ring-text {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  fill: rgba(255,255,255,0.85);
  text-transform: uppercase;
}
.fab-core {
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.fab-core svg { width: 22px; height: 22px; }
.fab-core-label { font-size: 10px; font-weight: 700; }

.fab-kakao .fab-core {
  background: linear-gradient(135deg, #8b6cf2 0%, #6e46d6 100%);
  color: #fff;
}
.fab-kakao .fab-core svg { color: #fff; }
.fab-insta .fab-core {
  background: linear-gradient(135deg, #f06ea8 0%, #ee4d8a 50%, #c9337a 100%);
  color: #fff;
}
.fab-youtube .fab-core {
  background: linear-gradient(135deg, #ff5252 0%, #ff0000 100%);

}

@keyframes fabSpin {
  from { transform: rotate(0deg); }

}

@media (min-width: 720px) {

/* ===== Reveal animation ===== */
.reveal {

  transform: translateY(24px);

}
.reveal.in {

/* ===== Facilities (재구성: 큰 메인 + 3D 썸네일) ===== */

/* 메인 스테이지 - 기존 대비 ~2배 큰 영역 */

/* 확대 버튼 */
.fac-stage-expand {

  top: 16px; right: 16px;

}

/* 라이트박스 모달 */

}
@keyframes facLbFadeIn {

  to { opacity: 1; }
}
.fac-lb-stage {

  max-height: 90vh;

  flex-direction: column;
  align-items: center;

}
.fac-lb-img {

  max-height: 82vh;

  height: auto;

}
.fac-lb-meta {

  align-items: center;

}
.fac-lb-counter {

}
.fac-lb-caption {

  letter-spacing: -0.01em;
}
.fac-lb-close {
  position: fixed;
  top: 18px; right: 18px;

.fac-lb-next { right: 18px; }
@media (min-width: 720px) {
  .fac-lb-arrow { width: 56px; height: 56px; font-size: 30px; }
  .fac-lb-prev { left: 32px; }

.fac-stage-img {

  position: absolute;

@media (min-width: 720px) {

}
.fac-stage-counter {
  font-family: 'Inter', monospace;
  font-size: 13px;
  letter-spacing: 0.08em;

.fac-stage-now { color: #F2C94C; font-weight: 700; font-size: 18px; }

/* 3D 썸네일 스트립 */
.fac-strip {
  margin-top: 24px;
  overflow-x: auto;
  overflow-y: visible;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 56px 0 32px;
  perspective: 1200px;
}
.fac-strip::-webkit-scrollbar { display: none; }
.fac-strip-inner {
  display: flex;
  gap: 10px;
  padding: 0 16px;
  align-items: center;
  transform-style: preserve-3d;
}
.fac-thumb {
  flex-shrink: 0;
  width: 110px;
  height: 70px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #0A0A0B;
  cursor: pointer;
  position: relative;
  padding: 0;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .2s, box-shadow .35s;
  transform-origin: center;
}
/* 히트 영역을 카드 위/아래로 확장 — 마우스가 살짝만 근처에 와도 반응 */
.fac-thumb::before {
  content: "";
  position: absolute;
  inset: -22px -8px;
  background: transparent;
  z-index: 1;
}
.fac-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  filter: brightness(0.55) saturate(0.85);
  transition: filter .3s ease;
}
.fac-thumb-num {
  position: absolute;
  top: 6px; left: 8px;
  font-family: 'Inter', monospace;
  font-size: 10px;
  font-weight: 700;
  color: rgba(255,255,255,0.85);
  letter-spacing: 0.06em;
  text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}
.fac-thumb:hover {
  transform: perspective(1200px) translateZ(60px) scale(1.18) !important;
  border-color: rgba(242,201,76,0.6);
  box-shadow: 0 22px 50px -14px rgba(242,201,76,0.5);
  z-index: 8;
}
.fac-thumb:hover img { filter: brightness(1) saturate(1.05); }
.fac-thumb.active {
  border-color: #F2C94C;
  box-shadow: 0 18px 40px -12px rgba(242,201,76,0.55), 0 0 0 2px #F2C94C;
  z-index: 5;
}
.fac-thumb.active img { filter: brightness(1) saturate(1.05); }
.fac-thumb.active .fac-thumb-num { color: #F2C94C; }

@media (min-width: 720px) {
  .fac-thumb { width: 150px; height: 95px; }
  .fac-strip-inner { padding: 0 24px; gap: 14px; }
}

/* ===== Marquee tag bar (between sections) ===== */
.marquee {
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  background: var(--bg);
  overflow: hidden;
  padding: 18px 0;
}
.marquee-track {
  display: flex;
  gap: 48px;
  white-space: nowrap;
  animation: scroll-x 40s linear infinite;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.marquee-track span { display: inline-flex; align-items: center; gap: 48px; }
.marquee-track .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  display: inline-block;
}
@keyframes scroll-x {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}


/* ============== INTRO 3D ============== */
.intro {
  position: fixed; inset: 0; z-index: 9999;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  perspective: 1400px;
  perspective-origin: 50% 50%;
  transition: opacity .7s ease, visibility .7s;
}
.intro::before {
  content: "";
  position: absolute; inset: -10%;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(255,68,128,.18), transparent 55%),
    radial-gradient(ellipse at 70% 70%, rgba(120,80,255,.14), transparent 55%);
  filter: blur(60px);
  opacity: 0;
  transition: opacity 1s ease;
}
.intro-show::before, .intro-zoom::before { opacity: 1; }
.intro-stage {
  position: relative;
  transform-style: preserve-3d;
  width: 100%;
  display: flex; justify-content: center;
}
.intro-3d {
  position: relative;
  text-align: center;
  color: #fff;
  transform-style: preserve-3d;
  transform: translateZ(-1200px) rotateX(18deg);
  opacity: 0;
  transition:
    transform 1.6s cubic-bezier(.16,1,.3,1),
    opacity .8s ease;
  padding: 0 24px;
}
.intro-show .intro-3d {
  transform: translateZ(0) rotateX(0deg);
  opacity: 1;
}
.intro-zoom .intro-3d {
  transform: translateZ(2200px) rotateX(-12deg) scale(.7);
  opacity: 0;
  transition:
    transform 1.5s cubic-bezier(.7,0,.84,0),
    opacity 1.4s ease-in;
}
.intro-done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.intro-eyebrow {
  font-size: 13px;
  letter-spacing: .42em;
  font-weight: 600;
  color: #ff6b9a;
  margin-bottom: 28px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .8s ease .2s, transform .8s ease .2s;
}
.intro-show .intro-eyebrow { opacity: 1; transform: translateY(0); }

.intro-headline {
  font-family: var(--font-display, 'Pretendard', sans-serif);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -.02em;
  margin: 0;
  display: flex; flex-direction: column; gap: 14px;
}
.intro-line-1, .intro-line-2, .intro-line-3 {
  display: block;
  opacity: 0;
  transform: translateY(40px) translateZ(-200px);
  transition: opacity .9s ease, transform 1.1s cubic-bezier(.16,1,.3,1);
}
.intro-show .intro-line-1 { opacity: 1; transform: translateY(0) translateZ(0); transition-delay: .35s; }
.intro-show .intro-line-2 { opacity: 1; transform: translateY(0) translateZ(0); transition-delay: .55s; }
.intro-show .intro-line-3 { opacity: 1; transform: translateY(0) translateZ(0); transition-delay: .8s; }

.intro-line-1 {
  font-size: clamp(28px, 5vw, 64px);
  color: rgba(255,255,255,.92);
  font-weight: 700;
}
.intro-line-2 {
  font-size: clamp(56px, 12vw, 180px);
  display: flex; align-items: baseline; justify-content: center; gap: 16px;
  font-weight: 900;
}
.intro-num {
  background: linear-gradient(135deg, #ff4480 0%, #ff6b9a 50%, #ff9bbd 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 20px 60px rgba(255,68,128,.35);
  font-size: 1.4em;
  letter-spacing: -.04em;
}
.intro-unit {
  color: #fff;
  font-size: .42em;
  font-weight: 800;
}
.intro-line-3 {
  font-size: clamp(22px, 4vw, 48px);
  color: rgba(255,255,255,.85);
  font-weight: 600;
}
.intro-line-3 em {
  font-style: normal;
  background: linear-gradient(135deg, #ff4480, #ff9bbd);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-weight: 900;
}
.intro-foot {
  margin-top: 36px;
  font-size: 12px;
  letter-spacing: .35em;
  color: rgba(255,255,255,.5);
  display: inline-flex; align-items: center; gap: 10px;
  opacity: 0;
  transition: opacity 1s ease 1.1s;
}
.intro-show .intro-foot { opacity: 1; }
.intro-dot {
  width: 6px; height: 6px; border-radius: 999px;
  background: #ff4480;
  box-shadow: 0 0 12px #ff4480;
  animation: introPulse 1.4s ease-in-out infinite;
}
@keyframes introPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.6); opacity: .4; }
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

/* ============== HOOKS ============== */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((ents) => {
      ents.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function useCountUp(end, trigger) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!trigger) return;
    let raf, start = null;
    const dur = 1400;
    const tick = (t) => {
      if (!start) start = t;
      const p = Math.min(1, (t - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(end * eased));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [end, trigger]);
  return val;
}

function Stats() {
  const ref = useRef(null);
  const [trigger, setTrigger] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver((ents) => {
      ents.forEach(e => { if (e.isIntersecting) { setTrigger(true); io.disconnect(); } });
    }, { threshold: 0.3 });
    io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  return (
    <section className="stats-section parallax-section" data-parallax="stage-art" data-screen-label="02 Stats" ref={ref}>
      <div className="wrap">
        <div className="sec-head reveal">

    </section>
  );
}

function Facilities() {
  const [active, setActive] = useState(0);
  const [lightbox, setLightbox] = useState(false);
  const stripRef = useRef(null);

  // 활성 썸네일을 컨테이너 중앙에 위치시킴
  const centerThumb = (idx, behavior = 'smooth') => {
    const strip = stripRef.current;
    if (!strip) return;
    const el = strip.querySelector(`[data-idx="${idx}"]`);
    if (!el) return;
    const target = el.offsetLeft - strip.clientWidth/2 + el.offsetWidth/2;
    strip.scrollTo({ left: Math.max(0, target), behavior });
  };

  // active 변경 시 중앙 정렬
  useEffect(() => {
    centerThumb(active, 'smooth');
  }, [active]);

  // 초기 마운트 시 즉시 중앙 정렬 (이미지 로드 후 한 번 더)
  useEffect(() => {
    const strip = stripRef.current;
    if (!strip) return;

    // 레이아웃 직후
    requestAnimationFrame(() => centerThumb(0, 'auto'));

    // 썸네일 이미지 로드 후 다시 정렬 (이미지로 인해 레이아웃이 변할 수 있음)
    const imgs = strip.querySelectorAll('img');
    let pending = imgs.length;
    if (pending === 0) return;
    const onLoad = () => {
      pending--;
      if (pending <= 0) centerThumb(0, 'auto');
    };
    imgs.forEach(img => {
      if (img.complete) onLoad();
      else {
        img.addEventListener('load', onLoad, { once: true });
        img.addEventListener('error', onLoad, { once: true });
      }
    });

    // 윈도우 리사이즈 시 재정렬
    const onResize = () => centerThumb(active, 'auto');
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
    // eslint-disable-next-line
  }, []);

  const current = FACILITY_GALLERY[active];

  return (
    <section className="facilities-section parallax-section" data-parallax="studio" data-screen-label="Facilities" id="facilities">
      <div className="wrap">
        <div className="sec-head reveal">
          <div className="sec-eyebrow">FACILITIES</div>
          <h2 className="sec-title">실력은 <span className="accent">환경</span>에서 만들어집니다</h2>
        </div>

        {/* 메인 큰 이미지 */}
        <div className="fac-stage reveal" onClick={() => setLightbox(true)} role="button" tabIndex={0}
          onKeyDown={(e)=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); setLightbox(true);}}}
        >
          {FACILITY_GALLERY.map((f, i) => {
            // 활성 + 양옆 2장만 미리 로드 — 나머지는 active로 바뀔 때 로드
            const offset = Math.abs(i - active);
            const shouldLoad = offset <= 2 || (active === 0 && i >= FACILITY_GALLERY.length - 2) || (active === FACILITY_GALLERY.length - 1 && i <= 1);
            return (
              <div
                key={i}
                className={`fac-stage-img ${i === active ? 'active' : ''}`}
                style={{ backgroundImage: shouldLoad ? `url(${f.src})` : 'none' }}
                aria-hidden={i !== active}
              />
            );
          })}
          <div className="fac-stage-grad" />
          <div className="fac-stage-nav">
            <button
              className="fac-stage-btn"
              onClick={(e) => { e.stopPropagation(); setActive((active - 1 + FACILITY_GALLERY.length) % FACILITY_GALLERY.length); }}
              aria-label="이전 시설"
            >‹</button>
            <button
              className="fac-stage-btn"
              onClick={(e) => { e.stopPropagation(); setActive((active + 1) % FACILITY_GALLERY.length); }}
              aria-label="다음 시설"
            >›</button>
          </div>
          <button
            className="fac-stage-expand"
            onClick={(e)=>{ e.stopPropagation(); setLightbox(true); }}
            aria-label="크게 보기"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          </button>
        </div>

        {/* 3D 썸네일 카드 스트립 */}
        <div className="fac-strip reveal" ref={stripRef}>
          <div className="fac-strip-inner">
            {FACILITY_GALLERY.map((f, i) => {
              const offset = i - active;
              const isActive = i === active;
              return (
                <button
                  key={i}
                  data-idx={i}
                  className={`fac-thumb ${isActive ? 'active' : ''}`}
                  onClick={() => {
                    if (isActive) setLightbox(true);
                    else setActive(i);
                  }}
                  style={{
                    '--offset': offset,
                    transform: `perspective(1200px) rotateY(${offset * -8}deg) translateZ(${isActive ? 30 : 0}px) scale(${isActive ? 1.08 : 0.92})`,
                  }}
                  aria-label={`${f.caption} 보기`}
                >
                  <img src={f.src} alt={f.caption} loading="lazy" />
                  <span className="fac-thumb-num">{String(i+1).padStart(2,'0')}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>

      {lightbox && (
        <FacilityLightbox
          items={FACILITY_GALLERY}
          index={active}
          onClose={() => setLightbox(false)}
          onPrev={() => setActive((active - 1 + FACILITY_GALLERY.length) % FACILITY_GALLERY.length)}
          onNext={() => setActive((active + 1) % FACILITY_GALLERY.length)}
        />
      )}
    </section>
  );
}

function FacilityLightbox({ items, index, onClose, onPrev, onNext }) {
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowLeft') onPrev();
      else if (e.key === 'ArrowRight') onNext();
    };
    window.addEventListener('keydown', onKey);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      window.removeEventListener('keydown', onKey);
      document.body.style.overflow = prevOverflow;
    };
  }, [onClose, onPrev, onNext]);

  const cur = items[index];
  return (
    <div className="fac-lightbox" onClick={onClose} role="dialog" aria-modal="true">
      <button className="fac-lb-close" onClick={(e)=>{e.stopPropagation(); onClose();}} aria-label="닫기">×</button>
      <button className="fac-lb-arrow fac-lb-prev" onClick={(e)=>{e.stopPropagation(); onPrev();}} aria-label="이전">‹</button>
      <button className="fac-lb-arrow fac-lb-next" onClick={(e)=>{e.stopPropagation(); onNext();}} aria-label="다음">›</button>
      <div className="fac-lb-stage" onClick={(e)=>e.stopPropagation()}>
        <img src={cur.src} alt={cur.caption} className="fac-lb-img" />
        <div className="fac-lb-meta">
          <span className="fac-lb-counter">{String(index+1).padStart(2,'0')} / {String(items.length).padStart(2,'0')}</span>
          <span className="fac-lb-caption">{cur.caption}</span>
        </div>
      </div>
    </div>
  );
}

function FounderIntro() {
  const [phase, setPhase] = React.useState('init'); // init -> show -> zoom -> done
  const [hidden, setHidden] = React.useState(false);
  React.useEffect(() => {
    if (hidden) return;
    document.body.style.overflow = 'hidden';
    const t1 = setTimeout(() => setPhase('show'), 50);
    const t2 = setTimeout(() => setPhase('zoom'), 2700);
    const t3 = setTimeout(() => {
      setPhase('done');
      document.body.style.overflow = '';
      setTimeout(() => setHidden(true), 800);
    }, 4200);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); document.body.style.overflow = ''; };
  }, [hidden]);
  if (hidden) return null;
  return (
    <div className={`intro intro-${phase}`} aria-hidden={phase === 'done'}>
      <div className="intro-stage">
        <div className="intro-3d">
          <div className="intro-eyebrow">FOUNDER &amp; HEAD COACH</div>
          <h1 className="intro-headline">
            <span className="intro-line-1">SM 엔터테인먼트</span>
            <span className="intro-line-2"><span className="intro-num">15</span><span className="intro-unit">년 전속 프로듀서</span></span>
            <span className="intro-line-3">원장이 <em>직접 운영</em>합니다</span>
          </h1>
          <div className="intro-foot">
            <span className="intro-dot" />
            BEST VOCAL &amp; DANCE · SINCE 2013
          </div>
        </div>
      </div>
    </div>
  );
}
