<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFC800">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>BVD 선생님 정산</title>
<meta name="robots" content="noindex">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --ink: #1B1F3B; --muted: #5C627C; --line: #DFE2EE;
  --accent: #3F3FD8; --accent-ink: #FFFFFF; --accent-soft: #E9E9FB;
  --money: #0B6B5F; --money-soft: #E1F2EE;
  --warn: #8F5600; --warn-soft: #FFF1D6;
  --bad: #B3261E; --bad-soft: #FDE7E5;
  --ok: #1B7F3B; --ok-soft: #E1F3E6;
  --shadow: 0 1px 2px rgba(27,31,59,.06), 0 4px 14px rgba(27,31,59,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141F; --surface: #1B1E2E; --ink: #ECEEF8; --muted: #A5ABC4; --line: #2E3248;
    --accent: #9A9AFF; --accent-ink: #12141F; --accent-soft: #2A2C55;
    --money: #62D6C1; --money-soft: #16332E;
    --warn: #F2B857; --warn-soft: #3A2E14;
    --bad: #FF8F85; --bad-soft: #3B1B1A;
    --ok: #74D391; --ok-soft: #14301E;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141F; --surface: #1B1E2E; --ink: #ECEEF8; --muted: #A5ABC4; --line: #2E3248;
  --accent: #9A9AFF; --accent-ink: #12141F; --accent-soft: #2A2C55;
  --money: #62D6C1; --money-soft: #16332E;
  --warn: #F2B857; --warn-soft: #3A2E14;
  --bad: #FF8F85; --bad-soft: #3B1B1A;
  --ok: #74D391; --ok-soft: #14301E;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  font-size: 16px; line-height: 1.55; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  /* 아이폰 앱 모드: 시계·배터리 영역과 아래 홈 바 영역을 비워 둡니다 */
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 1.1rem; font-weight: 700; text-wrap: balance; }
h3 { font-size: 1rem; font-weight: 700; }

.shell { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.shell.wide { max-width: 1000px; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
.grow { flex: 1 1 0; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.tiny { font-size: .8125rem; }
.num { font-variant-numeric: tabular-nums; }
.right { text-align: right; }

/* 머리글 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-size: 1.15rem; line-height: 1.25; overflow-wrap: anywhere; }
.brand span { font-size: .8125rem; color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 8px 6px; min-height: 40px; font-size: .9375rem; }
.demo-banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .875rem; }

/* 탭 */
.tabs { display: flex; gap: 4px; background: var(--accent-soft); padding: 4px; border-radius: 12px; overflow-x: auto; }
.tabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 10px 12px; min-height: 44px; border-radius: 9px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--bad); color: var(--surface); font-size: .75rem; line-height: 20px; text-align: center; }

/* 카드 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card h2 + .muted { margin-top: 2px; }

/* 폼 */
label.field { display: flex; flex-direction: column; gap: 6px; font-size: .875rem; font-weight: 500; color: var(--muted); }
.field > span { display: block; }
input[type=text], input[type=password], input[type=date], input[type=number], input[type=search], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--surface); color: var(--ink); font-size: 1rem;
}
textarea { min-height: 96px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 10px 18px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: .9rem; font-weight: 500; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.err { color: var(--bad); background: var(--bad-soft); padding: 10px 12px; border-radius: 10px; font-size: .9375rem; overflow-wrap: anywhere; }
.note { color: var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 10px; font-size: .9375rem; }
.okbox { color: var(--ok); background: var(--ok-soft); padding: 10px 12px; border-radius: 10px; font-size: .9375rem; }

.seg { display: flex; gap: 4px; background: var(--accent-soft); padding: 4px; border-radius: 12px; }
.seg button { flex: 1; border: 0; background: transparent; min-height: 44px; border-radius: 9px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 48px; padding: 8px 16px; border-radius: 24px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.4rem; line-height: 1; }
.stepper output { min-width: 64px; text-align: center; font-size: 1.4rem; font-weight: 700; }
.statuses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.statuses button {
  text-align: left; padding: 10px 12px; min-height: 56px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; gap: 2px;
}
.statuses button b { font-size: .9375rem; overflow-wrap: anywhere; }
.statuses button span { font-size: .75rem; color: var(--muted); }
.statuses button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }

.amount {
  background: var(--money-soft); color: var(--money); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px;
}
.amount small { font-size: .8125rem; opacity: .9; }
.amount strong { font-size: 1.9rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.amount.empty { background: var(--accent-soft); color: var(--muted); }
.amount.empty strong { font-size: 1rem; font-weight: 500; }
.amount.warnbox { background: var(--warn-soft); color: var(--warn); }
.amount.warnbox strong { font-size: 1.1rem; }

/* 목록 */
.list { display: flex; flex-direction: column; }
.item {
  display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0;
  width: 100%; text-align: left; min-height: 56px;
}
.list > .item:first-child { border-top: 0; }
.item .main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .main b { font-weight: 500; overflow-wrap: anywhere; }
.item .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item .amt.zero { color: var(--muted); font-weight: 500; }
.item .amt.unset { color: var(--warn); }
.datehead { font-size: .8125rem; font-weight: 700; color: var(--muted); padding: 14px 0 2px; }
.tag { display: inline-block; font-size: .75rem; padding: 1px 8px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); margin-right: 4px; white-space: nowrap; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.mute { background: var(--bg); color: var(--muted); }

.summary { display: flex; flex-direction: column; gap: 4px; }
.summary .big { font-size: 2.1rem; font-weight: 700; color: var(--money); font-variant-numeric: tabular-nums; line-height: 1.2; }

/* 표 */
.tablewrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9375rem; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .8125rem; color: var(--muted); font-weight: 500; white-space: nowrap; background: var(--bg); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--accent-soft); }
tfoot td { font-weight: 700; background: var(--bg); }
.namebtn { background: none; border: 0; padding: 4px 0; font-weight: 700; color: var(--accent); text-align: left; min-height: 36px; }

/* 시트(아래에서 올라오는 창) */
.backdrop { position: fixed; inset: 0; background: rgba(10,12,24,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.sheet {
  background: var(--surface); color: var(--ink); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
@media (min-width: 640px) {
  .backdrop { align-items: center; }
  .sheet { border-radius: 20px; }
}
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 80;
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; max-width: min(92vw, 480px); text-align: center; box-shadow: var(--shadow);
}
.pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8125rem; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 40vh; overflow-y: auto; }
.pins { display: flex; flex-direction: column; gap: 6px; }
.pins div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; background: var(--bg); border-radius: 10px; }
.pins b { font-variant-numeric: tabular-nums; letter-spacing: .08em; }
.ratecard { display: flex; flex-direction: column; gap: 10px; }
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
hr.sep { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 0; }
@media (max-width: 420px) {
  .statuses { grid-template-columns: 1fr 1fr; }
  .summary .big { font-size: 1.8rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .statuses button { transition: background-color .12s, border-color .12s; }
}

.grouphead { margin: 8px 2px 0; font-size: 1.05rem; }
select:disabled { opacity: .6; }

</style>

</head>
<body>
<div id="app" class="shell"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript>이 화면은 자바스크립트가 켜져 있어야 사용할 수 있습니다.</noscript>
<script>
// Rules.js — 정산 규칙 (순수 함수)
// 구글 Apps Script(서버)와 웹 화면이 똑같은 코드를 씁니다. 이 파일에는 시트나 화면 코드가 없습니다.
var PayRules = (function () {
  'use strict';

  var DEFAULT_END_DAY = 31;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function lastDay(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); } // m: 1~12

  function parseDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > lastDay(y, mo)) return null;
    return { y: y, m: mo, d: d };
  }
  function fmtDate(o) { return o.y + '-' + pad(o.m) + '-' + pad(o.d); }
  function addDays(dateStr, n) {
    var p = parseDate(dateStr);
    var t = new Date(Date.UTC(p.y, p.m - 1, p.d) + n * 86400000);
    return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate());
  }
  function validKey(k) { return /^\d{4}-(0[1-9]|1[0-2])$/.test(String(k || '')); }
  function prevKey(key) {
    var y = +key.slice(0, 4), m = +key.slice(5, 7) - 1;
    if (m < 1) { m = 12; y--; }
    return y + '-' + pad(m);
  }
  function nextKey(key) {
    var y = +key.slice(0, 4), m = +key.slice(5, 7) + 1;
    if (m > 12) { m = 1; y++; }
    return y + '-' + pad(m);
  }
  function cleanEndDay(v) {
    var n = Math.floor(Number(v));
    if (!(n >= 1 && n <= 31)) return DEFAULT_END_DAY;
    return n;
  }

  // 정산 기간: 키는 "끝나는 달"(예: 2026-11). 끝나는 날은 그 달의 endDay일(말일이 더 빠르면 말일).
  // 시작일은 전 기간의 끝나는 날 다음 날이라서 빈 날도 겹치는 날도 생기지 않습니다.
  function periodEnd(key, endDay) {
    var y = +key.slice(0, 4), m = +key.slice(5, 7);
    return fmtDate({ y: y, m: m, d: Math.min(cleanEndDay(endDay), lastDay(y, m)) });
  }
  function periodRange(key, endDay) {
    return { key: key, start: addDays(periodEnd(prevKey(key), endDay), 1), end: periodEnd(key, endDay) };
  }
  function periodKeyOf(dateStr, endDay) {
    var p = parseDate(dateStr);
    if (!p) return null;
    var key = p.y + '-' + pad(p.m);
    return dateStr <= periodEnd(key, endDay) ? key : nextKey(key);
  }

  // 급여일: 정산 기간이 끝난 다음 달 5일
  function payDate(key) {
    var nk = nextKey(key);
    return nk + '-05';
  }

  // ----- 금액 계산 -----
  function toIntOrNull(v) {
    if (v === '' || v === null || v === undefined) return null;
    var n = Number(v);
    if (!isFinite(n) || n < 0) return null;
    return Math.round(n);
  }
  var DEFAULT_BANDS = [1, 2, 3, 4, 5]; // 구간의 시작 인원: 1명, 2명, 3명, 4명, 5명 이상
  // 인원 구간 정리: 오름차순, 1에서 시작, 최대 5개
  function cleanBands(b) {
    var out = [], i, n;
    if (!Array.isArray(b)) return DEFAULT_BANDS.slice();
    for (i = 0; i < b.length; i++) {
      n = Math.floor(Number(b[i]));
      if (isFinite(n) && n >= 1 && n <= 50 && (out.length === 0 || n > out[out.length - 1])) out.push(n);
    }
    if (!out.length || out[0] !== 1) return DEFAULT_BANDS.slice();
    return out.slice(0, 5);
  }
  function parseBands(v) {
    if (Array.isArray(v)) return cleanBands(v);
    var t = String(v === null || v === undefined ? '' : v).trim();
    if (!t) return DEFAULT_BANDS.slice();
    return cleanBands(t.split(/[^0-9]+/).filter(function (x) { return x !== ''; }).map(Number));
  }
  // 구간 이름: [1,4,7] → ["3명 이하","4~6명","7명 이상"]
  function bandLabels(bands) {
    var b = cleanBands(bands), out = [], i, lo, hi;
    for (i = 0; i < b.length; i++) {
      lo = b[i]; hi = i + 1 < b.length ? b[i + 1] - 1 : null;
      if (hi === null) out.push(lo + '명 이상');
      else if (lo === hi) out.push(lo + '명');
      else if (i === 0) out.push(hi + '명 이하');
      else out.push(lo + '~' + hi + '명');
    }
    return out;
  }
  // 인원수가 속한 구간 번호(0부터)
  function tierIndex(n, bands) {
    n = Math.floor(n);
    var b = cleanBands(bands), idx = 0, i;
    for (i = 0; i < b.length; i++) if (n >= b[i]) idx = i;
    return idx;
  }
  function makeRate(type, row) {
    if (!type || !row) return null;
    return {
      mode: type.mode === 'tiered' ? 'tiered' : 'fixed',
      bands: cleanBands(type.bands),
      fixed: toIntOrNull(row.fixed),
      tiers: [toIntOrNull(row.t1), toIntOrNull(row.t2), toIntOrNull(row.t3), toIntOrNull(row.t4), toIntOrNull(row.t5)]
    };
  }
  function hasValues(r) {
    return toIntOrNull(r.fixed) !== null || toIntOrNull(r.t1) !== null || toIntOrNull(r.t2) !== null ||
      toIntOrNull(r.t3) !== null || toIntOrNull(r.t4) !== null || toIntOrNull(r.t5) !== null;
  }
  // 개인 수업 급여가 있으면 그것, 없으면 기본 수업 급여("*"). 값이 모두 비어 있는 줄은 "없음"으로 봅니다.
  function resolveRate(rateRows, type, acctId) {
    if (!type) return null;
    var own = null, def = null, i;
    for (i = 0; i < rateRows.length; i++) {
      var r = rateRows[i];
      if (String(r.typeId) !== String(type.id) || !hasValues(r)) continue;
      if (String(r.acctId) === String(acctId)) own = r;
      else if (String(r.acctId) === '*') def = r;
    }
    return makeRate(type, own || def);
  }
  // 반환: { amount: 숫자|null, pay: true|false, reason: ''|'no_rate'|'need_headcount'|'bad_status' }
  function calcLesson(statusRule, rate, headcount) {
    if (!statusRule) return { amount: null, pay: false, reason: 'bad_status' };
    var pays = Number(statusRule.pay) === 1;
    if (!pays) return { amount: 0, pay: false, reason: '' };
    if (!rate) return { amount: null, pay: true, reason: 'no_rate' };
    if (rate.mode === 'fixed') {
      if (rate.fixed === null) return { amount: null, pay: true, reason: 'no_rate' };
      return { amount: rate.fixed, pay: true, reason: '' };
    }
    var n = Math.floor(Number(headcount));
    if (!(n >= 1)) return { amount: null, pay: true, reason: 'need_headcount' };
    var t = rate.tiers[tierIndex(n, rate.bands)];
    if (t === null || t === undefined) return { amount: null, pay: true, reason: 'no_rate' };
    return { amount: t, pay: true, reason: '' };

    // 선생님별 현재 적용 수업별 급여 한눈에 보기

      return h('tr', null, h('td', null, h('button', { class: 'namebtn', type: 'button', onclick: function () { a.rateTarget = tc2.id; render(); window.scrollTo(0, 0); } }, tc2.name)),
        activeTypes.map(function (t) { return h('td', { class: 'n', text: rateText(t, R.resolveRate(d.rates, t, tc2.id)) }); }));
    });
    if (rows.length) box.appendChild(h('div', { class: 'card stack' }, h('h2', { text: '선생님별 수업 급여 한눈에 보기' }),
      h('p', { class: 'tiny muted', text: '인원별 급여는 수업마다 정해진 인원 구간 순서(예: 4명 이하 / 5명 이상)이며 단위는 만 원입니다. 이름을 누르면 그 선생님 수업별 급여를 고칠 수 있어요.' }),
      h('div', { class: 'tablewrap' }, h('table', null, h('thead', null, h('tr', null, h('th', { text: '선생님' }), activeTypes.map(function (t) { return h('th', { class: 'n', text: t.name }); }))), h('tbody', null, rows)))));

    // 수업 유형 관리
    var tbox = h('div', { class: 'card stack' }, h('h2', { text: '수업 유형 관리' }),
      h('p', { class: 'small muted', text: '새 수업 종류(예: 키즈 댄스)를 추가하면 선생님 입력 화면에 바로 나타납니다. 쓰지 않는 유형은 숨길 수 있어요.' }));
    d.types.forEach(function (t) {
      var nm = h('input', { type: 'text', maxlength: '20', 'aria-label': '유형 이름' }); nm.value = t.name;
      var go = h('button', { class: 'btn small', type: 'button' }, '이름 저장');
      go.addEventListener('click', function () { busyBtn(go, function () { return api('admin.setType', { id: t.id, name: nm.value, mode: t.mode, active: t.active }).then(function () { toast('저장했어요.'); loadAdmin(); }); }).catch(function (e) { toast(errText(e)); }); });
      var tg = h('button', { class: 'btn small', type: 'button' }, t.active ? '숨기기' : '다시 사용');
      tg.addEventListener('click', function () { busyBtn(tg, function () { return api('admin.setType', { id: t.id, name: t.name, mode: t.mode, active: !t.active }).then(function () { loadAdmin(); }); }).catch(function (e) { toast(errText(e)); }); });
      tbox.appendChild(h('div', { class: 'row' }, h('div', { style: 'flex:1 1 160px;min-width:0' }, nm), h('span', { class: 'tag ' + (t.active ? '' : 'mute'), text: (t.group ? t.group + ' · ' : '') + (t.mode === 'fixed' ? '1회 금액' : '인원별') + (t.active ? '' : ' · 숨김') }), go, tg));
    });
    var nn = h('input', { type: 'text', maxlength: '20', placeholder: '새 유형 이름', 'aria-label': '새 유형 이름' });
    var mode = h('select', { 'aria-label': '금액 방식' }, h('option', { value: 'fixed', text: '1회 금액이 정해져 있음' }), h('option', { value: 'tiered', text: '인원수에 따라 금액이 달라짐' }));
    var grp = h('select', { 'aria-label': '과' }, h('option', { value: '', text: '과 없음(기타)' }), ['보컬과', '악기과', '댄스과'].map(function (g) { return h('option', { value: g, text: g }); }));
    var addT = h('button', { class: 'btn small primary', type: 'button' }, '유형 추가');
    var terr = errBox();
    addT.addEventListener('click', function () { showErr(terr, ''); busyBtn(addT, function () { return api('admin.setType', { name: nn.value, mode: mode.value, group: grp.value }).then(function () { toast('추가했어요. 위에서 수업별 급여를 입력해 주세요.'); loadAdmin(); }); }).catch(function (e) { showErr(terr, errText(e)); }); });
    tbox.appendChild(h('hr', { class: 'sep' }));
    tbox.appendChild(nn); tbox.appendChild(grp); tbox.appendChild(mode); tbox.appendChild(terr); tbox.appendChild(addT);
    box.appendChild(tbox);
    return box;
  }

  function adminSettings() {
    var a = S.a, s = a.settings, box = h('div', { class: 'stack' });
    var endDay = h('input', { type: 'number', min: '1', max: '31', inputmode: 'numeric', 'aria-label': '정산 기간 마지막 날' }); endDay.value = String(s.endDay);
    var tax = h('input', { type: 'text', inputmode: 'decimal', 'aria-label': '원천징수율' }); tax.value = String(Math.round(s.withholdingRate * 1000) / 10);
    var err = errBox();
    var save = h('button', { class: 'btn primary block', type: 'button' }, '저장');
    save.addEventListener('click', function () {
      showErr(err, '');
      var pct = Number(String(tax.value).replace('%', ''));
      if (!(pct >= 0 && pct <= 50)) return showErr(err, '원천징수율은 0~50 사이 숫자로 입력해 주세요.');
      busyBtn(save, function () { return api('admin.setSettings', { endDay: Number(endDay.value), withholdingRate: pct / 100 }).then(function () { toast('저장했어요.'); S.a.overview = null; loadAdmin(); }); }).catch(function (e) { showErr(err, errText(e)); });
    });
    box.appendChild(h('div', { class: 'card stack' }, h('h2', { text: '정산 기준' }),
      field('매달 정산 기간의 마지막 날 (현재 ' + s.endDay + '일 · 31 = 말일)', endDay),
      h('p', { class: 'tiny muted', text: '31로 두면 "그 달 1일 ~ 말일" 수업이 한 달 정산입니다(말일이 31일보다 빠른 달도 알아서 말일까지). 지급일은 다음 달 5일입니다. 마감한 기간이 생기면 이 값은 바꿀 수 없습니다.' }),
      field('원천징수율 (%) — 0이면 표시하지 않음', tax),
      h('p', { class: 'tiny muted', text: '프리랜서 사업소득 3.3%를 적용하려면 3.3을 입력하세요. 세무사님과 상의해 정해 주세요.' }),
      err, save));
    box.appendChild(h('div', { class: 'card stack' }, h('h2', { text: '데이터 보관' }),
      h('p', { class: 'small', text: '모든 기록은 구글 시트에 쌓이고, 매일 새벽 자동 백업(최근 14개)이 만들어집니다. 마감한 달의 표를 세무사님께 보낸 뒤, 시트의 오래된 기록은 직접 지우셔도 됩니다.' })));
    return box;
  }

  // ===== 그리기 =====
  function render() {
    var root = $('app');
    root.textContent = '';
    root.classList.toggle('wide', isMgr());
    if (!S.session) root.appendChild(viewLogin());
    else if (isMgr()) root.appendChild(viewAdmin());
    else root.appendChild(viewTeacher());
  }

  // ===== 시작 =====
  (function boot() {
    var raw = store(SESSION_KEY);
    if (raw && !DEMO) {
      try { var s = JSON.parse(raw); if (s && s.token && s.role) { S.session = s; S.tab = s.role === 'teacher' ? 'entry' : 'overview'; S.a = {}; } } catch (e) { /* 무시 */ }
    }
    render();
    if (S.session) loadSession(); else loadNames();
  })();
})();

</script>

</body>
</html>
